<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Anexo Cobro v6.8.0-STABLE</title>

  <!-- Preconnect: Resuelve DNS en paralelo antes de que se pidan los recursos -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <!-- Font Awesome: media=print + onload = carga sin bloquear render -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

  <!-- Leaflet CSS: no bloquea -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" /></noscript>

  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Leaflet JS: defer = se descarga en paralelo pero ejecuta DESPUÉS del HTML -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>

  <script>
    // SECURITY ALIAS: Prevents "handleSync is not defined" from legacy cached components
    window.handleSync = function() {
      console.warn("Legacy handleSync called. Redirecting to global force sync...");
      if (window._triggerForceSync) {
        window._triggerForceSync();
      } else {
        console.error("Force sync trigger not yet initialized.");
      }
    };
  </script>

  <!-- Prevent Caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <!-- VERSION_V5_2_0_FORCE_REDEPLOY -->
  <div id="error-trap"
    style="display:none; color:red; padding:20px; font-family:monospace; background:white; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999;">
  </div>


  <script>
    // --- MECANISMO DE RECUPERACIÓN (Anti-Pantalla en Blanco) ---
    (function () {
      const BOOT_TIMEOUT = 15000;
      let bootFinished = false;

      window.addEventListener('load', () => {
        setTimeout(() => {
          bootFinished = true;
          console.log("Sistema cargado establemente.");
        }, BOOT_TIMEOUT);
      });

      const handlePanic = (msg) => {
        // Ignorar errores transitorios o de ServiceWorker que no impiden el funcionamiento
        const isTransient = /signal is aborted|AbortError|Failed to fetch|network error|ServiceWorker|script error|The request was aborted/i.test(msg);
        if (isTransient) return;

        console.error("Error crítico detectado:", msg);
        var trap = document.getElementById('error-trap');
        if (trap) {
          trap.style.display = 'block';
          trap.innerHTML = 
            '<div style="background:#0f172a; color:white; height:100vh; padding:20px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif;">' +
              '<h1 style="font-size:60px; margin:0;">🛠️</h1>' +
              '<h2 style="font-size:20px; font-weight:bold; margin:10px 0; color:#f1f5f9;">SISTEMA EN REPARACIÓN</h2>' +
              '<p style="color:#94a3b8; margin-bottom:20px; font-size:14px; max-width:300px;">La app detectó un problema técnico. Pulsa abajo para resetearla.</p>' +
              '<div style="background:#1e293b; padding:15px; border-radius:12px; border:1px solid #334155; width:100%; max-width:400px; margin-bottom:20px; text-align:left;">' +
                '<p style="color:#ef4444; font-size:10px; font-weight:bold; text-transform:uppercase; margin:0 0 5px 0;">Error:</p>' +
                '<pre style="font-size:10px; color:#cbd5e1; margin:0; white-space:pre-wrap; word-break:break-all; max-height:200px; overflow:auto;">' + msg + '</pre>' +
              '</div>' +
              '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload(true);" ' +
                'style="background:linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color:white; padding:18px 36px; border-radius:20px; font-weight:bold; border:none; cursor:pointer; box-shadow:0 10px 20px -5px rgba(59,130,246,0.6); font-size:15px;">' +
                'REPARAR AHORA' +
              '</button>' +
            '</div>';
        }
      };

      window.addEventListener('error', (e) => {
        handlePanic(e.message || 'Error Desconocido');
      });
      window.addEventListener('unhandledrejection', (e) => {
        const msg = e.reason?.message || e.reason || "Error Promesa";
        handlePanic(msg.toString());
      });
    })();
  </script>
  <div id="root">
    <!-- SPINNER NATIVO: visible inmediatamente, antes de que React cargue. Diseño nuevo. -->
    <div id="native-splash" style="
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:#1a2a4a;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      z-index:99999;
    ">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
        #ns-title {
          font-family: 'Orbitron', monospace;
          font-size: 30px;
          font-weight: 900;
          letter-spacing: 6px;
          color: #e0f0ff;
          text-transform: uppercase;
          line-height: 1;
        }
        #ns-title span {
          color: #00bfff;
          text-shadow: 0 0 18px rgba(0,191,255,0.7), 0 0 40px rgba(0,191,255,0.3);
        }
        #ns-sub {
          font-family: 'Orbitron', monospace;
          font-size: 9px;
          letter-spacing: 8px;
          color: rgba(0,191,255,0.35);
          margin-top: 8px;
          text-transform: uppercase;
        }
        #ns-divider {
          width: 200px;
          height: 1px;
          background: linear-gradient(90deg, transparent, #00bfff55, transparent);
          margin: 10px auto 0;
        }
        #ns-loading {
          font-family: 'Orbitron', monospace;
          color: #4da6ff;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 8px;
          margin-bottom: 16px;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      </style>
      <div style="text-align:center; margin-bottom:32px;">
        <div id="ns-title">ANEXO<span>COBRO</span></div>
        <div id="ns-divider"></div>
        <div id="ns-sub">Sistema Core</div>
      </div>
      <div id="ns-loading">LOADING...</div>
      <div id="ns-bar" style="width:280px; height:34px; border:1.5px solid #0066cc; display:flex; padding:3px; gap:2px; box-sizing:border-box;">
        <div id="ns-fill" style="height:100%; background:#00bfff; width:0%; transition:width 0.2s ease;"></div>
      </div>
      <div id="ns-pct" style="font-family:'Orbitron',monospace; color:#4da6ff; font-size:24px; font-weight:900; margin-top:12px; letter-spacing:3px;">0%</div>
    </div>
    <script>
      (function() {
        var pct = 0;
        var fill = document.getElementById('ns-fill');
        var label = document.getElementById('ns-pct');
        var iv = setInterval(function() {
          pct = Math.min(pct + Math.floor(Math.random() * 8) + 3, 90);
          if (fill) fill.style.width = pct + '%';
          if (label) label.textContent = pct + '%';
          if (pct >= 90) clearInterval(iv);
        }, 200);
        window.__nativeSplashInterval = iv;
      })();
    </script>
  </div>
  <script>
    // Parche preventivo para bases de datos corruptas
    (function() {
      if (!localStorage.getItem('db_clear_v4')) {
        localStorage.setItem('db_clear_v4', 'true');
        indexedDB.deleteDatabase('_ionickv');
      }
    })();
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
